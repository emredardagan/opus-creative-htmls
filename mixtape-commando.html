<meta charset="utf-8">
<title>Mixtape Commando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#140c24;--bg2:#2b1a4a;--ink:#ffe9c9;--dim:#9a7fb8;--gold:#ffd23f;--pink:#ff4fa3;--coral:#ff7a59;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,var(--bg) 72%);background-color:var(--bg);color:var(--ink);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding-inline:16px;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#wrap{position:relative;border-radius:10px;box-shadow:0 0 0 3px #0b0616,0 0 0 6px #3a2560,0 18px 60px rgba(0,0,0,.6),0 0 90px rgba(255,79,163,.18)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:8px;outline:none}
#crt{position:absolute;inset:0;pointer-events:none;border-radius:8px;background-image:linear-gradient(to bottom,rgba(10,0,20,.22) 0 34%,transparent 34% 100%);background-size:100% 3px;box-shadow:inset 0 0 70px rgba(0,0,0,.55),inset 0 0 12px rgba(0,0,0,.6)}
#crt.off{background-image:none;box-shadow:none}
.legend{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;font-size:8px;line-height:1.8;color:var(--dim);max-width:900px;text-align:center}
.legend b{color:var(--gold);font-weight:400}
.legend .beat{color:var(--pink)}
#touch{display:none;width:100%;max-width:720px;margin-top:14px;justify-content:space-between;align-items:center;gap:12px}
#touch .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px}
#touch button{font:inherit;font-size:10px;color:var(--ink);background:#2b1a4a;border:2px solid #5a3a8a;border-radius:10px;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button:active,#touch button.on{background:#5a3a8a}
#touch .ab{display:flex;gap:12px;align-items:center}
#touch .big{width:66px;height:66px;border-radius:50%;font-size:12px}
#touch .big.a{background:#6a2040;border-color:var(--pink)}
#touch .big.b{background:#6a4a10;border-color:var(--gold)}
#touch .mini{display:flex;flex-direction:column;gap:8px}
#touch .mini button{padding:8px 6px;font-size:7px}
body.touch #touch{display:flex}
body.touch .legend{display:none}
@media (orientation:landscape) and (max-height:520px){
  body.touch #touch{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:none;padding-inline:16px;box-sizing:border-box;pointer-events:none;margin:0}
  body.touch #touch>*{pointer-events:auto;opacity:.75}
}
@media (prefers-reduced-motion:reduce){#crt{background-image:none}}
</style>

<div id="wrap"><canvas id="game" tabindex="0" aria-label="Mixtape Commando game screen"></canvas><div id="crt"></div></div>
<div class="legend">
  <span><b>ARROWS/WASD</b> RUN, AIM, DUCK, PIPE</span><span><b>Z / SPACE</b> JUMP</span><span><b>X / J</b> FIRE</span>
  <span class="beat">TAP FIRE ON THE BEAT = GOLD SHOTS</span><span><b>M</b> MUTE</span><span><b>C</b> CRT</span><span><b>P</b> PAUSE</span>
</div>
<div id="touch">
  <div class="pad">
    <span></span><button data-k="up" aria-label="Up">▲</button><span></span>
    <button data-k="left" aria-label="Left">◀</button><button data-k="down" aria-label="Down">▼</button><button data-k="right" aria-label="Right">▶</button>
    <span></span><span></span><span></span>
  </div>
  <div class="mini"><button data-k="start">START</button><button data-k="pause">PAUSE</button><button data-k="mute">MUTE</button></div>
  <div class="ab"><button class="big b" data-k="fire" aria-label="Fire">B<br>FIRE</button><button class="big a" data-k="jump" aria-label="Jump">A<br>JUMP</button></div>
</div>

<script>
(()=>{
'use strict';
const W=320,H=180,TS=16;
const cv=document.getElementById('game'),g=cv.getContext('2d');
cv.width=W;cv.height=H;g.imageSmoothingEnabled=false;
const crt=document.getElementById('crt');
const FONT='8px "Press Start 2P", monospace';

// ================= utils
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), sign=v=>v<0?-1:v>0?1:0;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;fn(x,c);return c;}
function R(x,c,px,py,w,h){x.fillStyle=c;x.fillRect(px,py,w,h);}
function pcircle(x,cx,cy,r,c){x.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);for(let dy=-r;dy<=r;dy++){const hw=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy)));x.fillRect(cx-hw,cy+dy,hw*2,1);}}
function pring(x,cx,cy,r,c){x.fillStyle=c;const n=Math.max(12,Math.round(r*6));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;x.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1);}}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function gradCanvas(w,h,stops){return mk(w,h,x=>{const id=x.createImageData(w,h),d=id.data,S=stops.map(s=>[s[0],hex(s[1])]);
  for(let y=0;y<h;y++){let i=0;while(i<S.length-2&&y>S[i+1][0])i++;const a=S[i],b=S[i+1];const t=clamp((y-a[0])/(b[0]-a[0]||1),0,1);
    for(let xx=0;xx<w;xx++){const th=(BAYER[(y&3)*4+(xx&3)]+.5)/16;const c=t>th?b[1]:a[1];const k=(y*w+xx)*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;}}
  x.putImageData(id,0,0);});}
function txt(s,x,y,c='#ffe9c9',al='left',sh='#1b0f24'){g.font=FONT;g.textBaseline='top';g.textAlign=al;if(sh){g.fillStyle=sh;g.fillText(s,Math.round(x)+1,Math.round(y)+1);}g.fillStyle=c;g.fillText(s,Math.round(x),Math.round(y));}
function wrap(s,n){const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line.trim());line=w;}else line+=' '+w;}if(line.trim())out.push(line.trim());return out;}
const TINY={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111','U':'101101101101111','P':'111101111100100','X':'101101010101101','+':'000010111010000'};
function tiny(s,x,y,c){x=Math.round(x);y=Math.round(y);for(const ch of s){const gl=TINY[ch];if(gl){for(let i=0;i<15;i++)if(gl[i]==='1'){g.fillStyle='#1b0f24';g.fillRect(x+i%3+1,y+(i/3|0)+1,1,1);}for(let i=0;i<15;i++)if(gl[i]==='1'){g.fillStyle=c;g.fillRect(x+i%3,y+(i/3|0),1,1);}}x+=4;}}
const NOTE=['..XX.','..X.X','..X..','..X..','XXX..','XXX..','.X...'];
function drawNote(x,y,c){x=Math.round(x);y=Math.round(y);NOTE.forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==='X'){g.fillStyle=c;g.fillRect(x+i,y+j,1,1);}});}

// ================= storage
let SAVE={best:0,sideB:false};
try{const s=JSON.parse(localStorage.getItem('mixtape-commando-v1')||'null');if(s)SAVE=Object.assign(SAVE,s);}catch(e){}
function persist(){try{localStorage.setItem('mixtape-commando-v1',JSON.stringify(SAVE));}catch(e){}}

// ================= input
const keys={},pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',KeyZ:'jump',Space:'jump',KeyK:'jump',KeyX:'fire',KeyJ:'fire',Enter:'start',KeyP:'pause',Escape:'pause',KeyM:'mute',KeyC:'crt'};
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA'];let kIdx=0;
function press(k){if(!keys[k])pressed[k]=true;keys[k]=true;audioInit();}
function release(k){keys[k]=false;}
addEventListener('keydown',e=>{
  if(G.state==='title'){if(e.code===KONAMI[kIdx]){kIdx++;if(kIdx===KONAMI.length){kIdx=0;if(!G.konami){G.konami=true;SFX.oneup();banner('30 LIVES. YOU KNOW THE CODE.');}}}else kIdx=e.code===KONAMI[0]?1:0;}
  const k=KEYMAP[e.code];if(k){if(!e.repeat)press(k);e.preventDefault();}else audioInit();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){release(k);e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
cv.addEventListener('pointerdown',()=>{audioInit();cv.focus();if(['title','intro','clear','over','ending'].includes(G.state))pressed.start=true;});
if(('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();b.classList.add('on');press(k);try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=e=>{e.preventDefault();b.classList.remove('on');release(k);};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});

// ================= audio
const AU={ctx:null,muted:false};let master,musicBus,sfxBus,noiseBuf;const PW={};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx;try{ctx=new C();}catch(e){return;}
  AU.ctx=ctx;
  master=ctx.createGain();master.gain.value=AU.muted?0:.6;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(master);master.connect(ctx.destination);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=.3;
  const wow=ctx.createDelay(.05);wow.delayTime.value=.012;
  const lfo=ctx.createOscillator();lfo.frequency.value=.55;const lg=ctx.createGain();lg.gain.value=.00085;lfo.connect(lg);lg.connect(wow.delayTime);lfo.start();
  musicBus=ctx.createGain();musicBus.gain.value=.85;musicBus.connect(wow);wow.connect(lp);lp.connect(comp);
  const conv=ctx.createConvolver();const len=ctx.sampleRate*2.2;const ib=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}conv.buffer=ib;
  const rv=ctx.createGain();rv.gain.value=.26;lp.connect(rv);rv.connect(conv);conv.connect(comp);
  sfxBus=ctx.createGain();sfxBus.gain.value=.7;sfxBus.connect(comp);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  for(const d of [.125,.25,.5]){const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)re[i]=2*Math.sin(Math.PI*i*d)/(Math.PI*i);PW[d]=ctx.createPeriodicWave(re,im);}
  // tape hiss
  const hs=ctx.createBufferSource();hs.buffer=noiseBuf;hs.loop=true;const hf=ctx.createBiquadFilter();hf.type='highpass';hf.frequency.value=7000;const hg=ctx.createGain();hg.gain.value=.012;hs.connect(hf);hf.connect(hg);hg.connect(master);hs.start();
  seq.next=ctx.currentTime+.08;seq.beats=[];
}
function setMuted(m){AU.muted=m;if(master)master.gain.setTargetAtTime(m?0:.6,AU.ctx.currentTime,.03);}
function tone(dest,type,f,t,dur,vol,o){o=o||{};const c=AU.ctx;const os=c.createOscillator();if(typeof type==='number')os.setPeriodicWave(PW[type]);else os.type=type;
  os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+dur);
  const gn=c.createGain();const a=o.a||.004,rel=o.rel||.04;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+a);
  gn.gain.setTargetAtTime(vol*(o.sus==null?.55:o.sus),t+a,dur*.35);gn.gain.setTargetAtTime(0,t+dur,rel/3);
  os.connect(gn);gn.connect(dest);os.start(t);os.stop(t+dur+rel+.08);}
function noise(dest,t,dur,vol,type,freq,q){const c=AU.ctx;const s=c.createBufferSource();s.buffer=noiseBuf;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
  const gn=c.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(gn);gn.connect(dest);s.start(t,Math.random()*1.5);s.stop(t+dur+.02);}
const ok=()=>AU.ctx&&!AU.muted;
const T0=()=>AU.ctx.currentTime+.005;
const SFX={
  jump(){if(!ok())return;tone(sfxBus,.25,280,T0(),.15,.1,{slide:760});},
  shoot(k,gold){if(!ok())return;const t=T0();
    if(k==='L')tone(sfxBus,'sawtooth',1600,t,.14,.05,{slide:220});
    else if(k==='F')tone(sfxBus,.25,380,t,.09,.08,{slide:900});
    else if(k==='S'){tone(sfxBus,.5,700,t,.07,.06,{slide:200});noise(sfxBus,t,.07,.07,'bandpass',2400,1);}
    else{tone(sfxBus,.5,980,t,.05,.05,{slide:320});noise(sfxBus,t,.04,.05,'highpass',3200);}
    if(gold)tone(sfxBus,.125,2093,t+.01,.08,.04);},
  beat(){if(!ok())return;const t=T0();tone(sfxBus,.125,1568,t,.06,.05);tone(sfxBus,.125,2349,t+.04,.12,.05);},
  coin(){if(!ok())return;const t=T0();tone(sfxBus,.25,988,t,.06,.08);tone(sfxBus,.25,1319,t+.065,.28,.08);},
  stomp(){if(!ok())return;const t=T0();tone(sfxBus,.5,440,t,.1,.12,{slide:110});noise(sfxBus,t,.06,.08,'lowpass',1200);},
  bump(){if(!ok())return;tone(sfxBus,'triangle',170,T0(),.08,.25,{slide:90});},
  brk(){if(!ok())return;const t=T0();noise(sfxBus,t,.25,.22,'lowpass',1600);tone(sfxBus,'triangle',220,t,.15,.2,{slide:60});},
  power(){if(!ok())return;const t=T0();[60,64,67,72,76,79,84,88].forEach((m,i)=>tone(sfxBus,.25,mtof(m),t+i*.04,.07,.07));},
  weapon(){if(!ok())return;const t=T0();[72,79,84,91,96].forEach((m,i)=>tone(sfxBus,.125,mtof(m),t+i*.05,.1,.07));},
  oneup(){if(!ok())return;const t=T0();[76,79,88,84,86,91].forEach((m,i)=>tone(sfxBus,.25,mtof(m),t+i*.08,.08,.08));},
  hurt(){if(!ok())return;const t=T0();tone(sfxBus,.5,660,t,.3,.12,{slide:90});},
  die(){if(!ok())return;const t=T0();[79,74,71,67,62,55,50].forEach((m,i)=>tone(sfxBus,.5,mtof(m),t+i*.09,.1,.09));},
  boom(big){if(!ok())return;const t=T0();noise(sfxBus,t,big?.9:.35,big?.35:.2,'lowpass',big?900:1800);tone(sfxBus,'sine',big?140:200,t,big?.5:.2,big?.4:.2,{slide:30});},
  pipe(){if(!ok())return;const t=T0();for(let i=0;i<3;i++)tone(sfxBus,.5,420,t+i*.12,.08,.08,{slide:160});},
  kick(){if(!ok())return;tone(sfxBus,.5,600,T0(),.06,.1,{slide:1400});},
  rewind(){if(!ok())return;const t=T0();tone(sfxBus,'sawtooth',180,t,1,.04,{slide:2600,sus:1});noise(sfxBus,t,1,.05,'bandpass',3000,2);},
  pause(){if(!ok())return;const t=T0();tone(sfxBus,.5,1046,t,.05,.07);tone(sfxBus,.5,784,t+.07,.05,.07);tone(sfxBus,.5,1046,t+.14,.08,.07);},
  hit(){if(!ok())return;tone(sfxBus,.5,220,T0(),.04,.06,{slide:140});},
  flag(){if(!ok())return;tone(sfxBus,.25,300,T0(),.9,.07,{slide:1800,sus:1});},
  fanfare(){if(!ok())return;const t=T0();[[67,0],[72,.12],[76,.24],[79,.36],[84,.5],[83,.8],[84,.92]].forEach(([m,d])=>{tone(sfxBus,.25,mtof(m),t+d,.14,.08);tone(sfxBus,'triangle',mtof(m-12),t+d,.14,.15);});},
  cp(){if(!ok())return;const t=T0();[67,71,74,79].forEach((m,i)=>tone(sfxBus,.125,mtof(m),t+i*.06,.12,.07));},
  select(){if(!ok())return;tone(sfxBus,.25,1200,T0(),.05,.06);},
  mix(){if(!ok())return;const t=T0();tone(sfxBus,'sawtooth',120,t,.5,.05,{slide:900,sus:1});[72,76,79,84,88,91,96].forEach((m,i)=>tone(sfxBus,.125,mtof(m),t+.3+i*.035,.1,.05));},
  eject(){if(!ok())return;const t=T0();tone(sfxBus,'square',120,t,.3,.1,{slide:60});noise(sfxBus,t,.5,.2,'lowpass',700);},
};

// ================= music sequencer
const CH={M7:[0,4,7,11],m7:[0,3,7,10],S6:[0,4,7,9],A9:[0,4,7,14],MAJ:[0,4,7],MIN:[0,3,7]};
function noteToMidi(n){const m=n.match(/^([A-G])(#|b)?(\d)$/);return 12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);}
function parseLead(s){const out=[];let st=0;for(const tok of s.trim().split(/\s+/)){const [n,l]=tok.split('/');if(n!=='r')out[st]={m:noteToMidi(n),len:+l};st+=+l;}out.length=st;return out;}
const TRACKS={
  title:{bpm:72,swing:.1,prog:[[48,'M7'],[45,'m7'],[41,'M7'],[43,'S6']],bass:'x.......x.....x.',arp:[0,1,2,3,2,1,0,1],arpOct:24,arpVol:.026,pad:1,
    drums:{k:'x.........x.....',s:'....x.......x...',h:'..x...x...x...x.'},lead:'G5/8 E5/8 C5/8 E5/4 G5/4 A5/8 G5/4 F5/4 D5/12 r/4',leadVol:.045},
  shore:{bpm:88,swing:.14,prog:[[53,'M7'],[52,'m7'],[50,'m7'],[48,'M7']],bass:'x.....x.x.....x.',arp:[0,2,1,3,2,1,3,2],arpOct:24,arpVol:.026,pad:1,
    drums:{k:'x.........x.....',s:'....x.......x...',h:'x.x.x.x.x.x.x.xo'},
    lead:'A4/2 C5/2 E5/4 D5/2 C5/2 A4/4 B4/2 D5/2 G5/6 E5/2 D5/4 F5/3 E5/3 D5/2 C5/4 A4/4 G4/2 A4/2 B4/2 C5/2 E5/8 A4/2 C5/2 F5/4 E5/2 C5/2 A4/4 G5/4 F5/2 E5/2 D5/4 B4/4 A4/2 C5/2 D5/2 F5/2 A5/4 G5/4 E5/6 D5/2 C5/8'},
  neon:{bpm:96,swing:.08,prog:[[45,'m7'],[41,'M7'],[48,'A9'],[43,'A9']],bass:'x..x..x.x..x.o..',arp:[0,1,2,3,1,2,3,4],arpOct:24,arpVol:.024,pad:1,
    drums:{k:'x.....x...x.....',s:'....x.......x...',h:'x.xxx.xxx.xxx.xo'},
    lead:'E5/2 A5/2 G5/2 E5/2 D5/2 E5/6 C5/2 A4/2 C5/2 E5/4 F5/2 E5/2 D5/2 E5/2 G5/2 C6/4 B5/2 G5/2 E5/4 D5/4 B4/2 D5/2 G5/4 A5/4 E5/2 A5/2 B5/2 C6/2 B5/2 A5/2 G5/4 F5/4 E5/2 C5/2 A4/8 G4/2 C5/2 E5/2 G5/2 C6/4 D6/4 B5/6 A5/2 G5/4 E5/4'},
  aurora:{bpm:78,swing:.12,prog:[[50,'M7'],[47,'m7'],[43,'M7'],[45,'S6']],bass:'x.......5.......',arp:[0,1,2,3,4,3,2,1],arpOct:24,arpVol:.026,pad:1,

function collideX(b,dx){const y0=Math.floor(b.y/16),y1=Math.floor((b.y+b.h-.01)/16);

  return 0;}
function collideY(b,prevBottom,isP){const x0=Math.floor(b.x/16),x1=Math.floor((b.x+b.w-.01)/16);b.headHit=null;
  if(b.vy>=0){const ty=Math.floor((b.y+b.h-.01)/16);
    for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,ty);if(SOLID(c)||(ONEW(c)&&prevBottom<=ty*16+.5&&!(b.drop>0))){b.y=ty*16-b.h;b.vy=0;b.onGround=true;b.groundTile={tx,ty,c};return;}}}
  else{const ty=Math.floor(b.y/16);let best=null,bd=1e9;const cx=b.x+b.w/2;
    for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,ty);if(SOLID(c)||(isP&&c==='h')){const d=Math.abs(tx*16+8-cx);if(d<bd){bd=d;best={tx,ty,c};}}}
    if(best){b.y=(ty+1)*16;b.vy=0;b.headHit=best;}}}

  e.y+=e.vy;e.onGround=false;collideY(e,pb,false);if(e.y>MAP.h*16+40)e.dead=true;}

  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;

  if(p.x<minX){p.x=minX;if(p.vx<0)p.vx=0;}if(p.x>maxX){p.x=maxX;if(p.vx>0)p.vx=0;}
  const vyBefore=p.vy;p.y+=p.vy;const was=p.onGround;p.onGround=false;collideY(p,pb,true);

}

function lightFuse(tx,ty,t){const k=tx+','+ty;if(MAP.fuseSet.has(k))return;MAP.fuseSet.add(k);MAP.fuses.push({tx,ty,t});}
function updateFuses(){for(const f of MAP.fuses){if(f.t<0)continue;f.t--;if(f.t===0){setTile(f.tx,f.ty,'.');boom(f.tx*16+8,f.ty*16+6,10);SFX.boom(false);G.shake=3;
  for(let i=0;i<3;i++)parts.push({k:'debris',x:f.tx*16+8,y:f.ty*16+4,vx:rnd(-1.5,1.5),vy:rnd(-4,-2),t:0,life:60,c:'#9aa4c4'});
  if(tileAt(f.tx+1,f.ty)==='E')lightFuse(f.tx+1,f.ty,22);f.t=-1;}}}
function updatePipe(){const p=P,pp=p.pipe;pp.t++;
  if(pp.dir==='down'){p.y+=.6;if(pp.t>=42){const w=pp.warp;if(w.to)enterBonus(w);else if(w.back)exitBonus();}}
  else{p.y-=.6;if(p.y+p.h<=pp.top){p.y=pp.top-p.h;p.pipe=null;p.onGround=true;}}}
function enterBonus(w){G.ret=w.ret;MAP=BONUS[w.to]();ents=[];items=[];bullets=[];ebullets=[];parts=[];
  P.pipe=null;P.x=MAP.start*16+3;P.y=32;P.vx=P.vy=0;cam.x=0;cam.y=0;playTrack('bonus');}
function exitBonus(){MAP=MAIN;ents=[];items=[];bullets=[];ebullets=[];parts=[];const r=G.ret;
  P.x=r.x*16+16-P.w/2;P.y=r.top*16;P.pipe={t:0,dir:'up',top:r.top*16};SFX.pipe();cam.x=clamp(P.x-W*.4,0,MAP.w*16-W);MAP.si=0;
  while(MAP.si<MAP.spawns.length&&MAP.spawns[MAP.si].tx*16<cam.x-16)MAP.si++;playTrack(MAP.theme.music);}

// ================= blocks
function headBump(h){const {tx,ty,c}=h,key=tx+','+ty,content=MAP.contents[key];
  if(c==='?'||c==='h'){setTile(tx,ty,'u');MAP.bumps.push({tx,ty,t:0});releaseContent(content||'coin',tx,ty);SFX.bump();}
  else if(c==='B'){
    if(content==='coins'){const n=(MAP.multi[key]||0)+1;MAP.multi[key]=n;releaseContent('coin',tx,ty);MAP.bumps.push({tx,ty,t:0});if(n>=8)setTile(tx,ty,'u');}
    else if(content){setTile(tx,ty,'u');MAP.bumps.push({tx,ty,t:0});releaseContent(content,tx,ty);SFX.bump();}
    else if(P.big){setTile(tx,ty,'.');SFX.brk();addScore(50);for(let i=0;i<4;i++)parts.push({k:'debris',x:tx*16+4+(i%2)*8,y:ty*16+4+(i>>1)*8,vx:(i%2?1:-1)*rnd(.8,1.6),vy:-rnd(2.5,4.5)-(i>>1?0:1),t:0,life:70,c:MAP.theme.c.brick});}
    else{MAP.bumps.push({tx,ty,t:0});SFX.bump();}}
  else SFX.bump();
  for(const e of ents)if(!e.dead&&!e.dying&&e.shoot&&e.onGround&&Math.abs(e.y+e.h-ty*16)<3&&e.x+e.w>tx*16&&e.x<tx*16+16)killEnt(e,'bump',{dir:sign(e.x-tx*16)||1});
  if(tileAt(tx,ty-1)==='o'){setTile(tx,ty-1,'.');getCoin(tx*16+8,ty*16-12);}}
function releaseContent(c,tx,ty){
  if(c==='coin'){getCoin(tx*16+8,ty*16-10);parts.push({k:'coin',x:tx*16+8,y:ty*16-8,vy:-4,t:0,life:26});return;}
  let it;
  if(c==='mush'){if(P.big)it={k:'cap',letter:['S','L','F'][ri(0,2)]};else it={k:'mush'};}
  else if(c==='star')it={k:'star'};else if(c==='1up')it={k:'1up'};else it={k:'cap',letter:c};
  items.push(Object.assign({x:tx*16+1,y:ty*16+2,w:14,h:14,vx:.8,vy:0,emerge:16,t:0},it));}
function collect(it){
  if(it.k==='mush'){if(!P.big){setBig(P,true);SFX.power();banner('SUPER SIZE!',80);}addScore(1000,it.x,it.y);}
  else if(it.k==='1up')oneUp(it.x,it.y);
  else if(it.k==='star'){P.star=600;seq.mul=1.22;SFX.power();banner('STAR BARRIER!',80);addScore(1000,it.x,it.y);}
  else if(it.k==='cap'){const L=it.letter;if(L==='R'){P.rapid=true;banner('RAPID FIRE!',80);}else if(L==='B'){P.star=600;seq.mul=1.22;}else{P.weapon=L;banner(WEAP[L].name+'!',80);}SFX.weapon();addScore(1000,it.x,it.y);}}
function updItems(){for(const it of items){it.t++;
  if(it.emerge>0){it.emerge--;it.y-=1;continue;}
  if(it.k==='mush'||it.k==='1up')entPhys(it,true);
  else if(it.k==='star'){entPhys(it,true);if(it.onGround)it.vy=-4.6;}
  else if(it.k==='cap'){entPhys(it,true);if(it.onGround)it.vy=-2.4;}
  if(!P.dead&&!P.pipe&&overlap(P,it)){collect(it);it.dead=true;}}
  items=items.filter(i=>!i.dead);}

// ================= enemies
const hardMul=()=>G.hard?1.25:1;
function spawnEnt(s){const e={type:s.type,tx:s.tx,ty:s.ty,t:0,vx:0,vy:0,flash:0,hp:1,face:-1};
  const ground=(w,h)=>{e.w=w;e.h=h;e.x=s.tx*16+(16-w)/2;e.y=s.ty*16-h;};
  switch(s.type){
    case 'g':ground(12,12);Object.assign(e,{vx:-.45*hardMul(),stomp:true,harm:true,shoot:true});break;
    case 'k':ground(12,15);Object.assign(e,{vx:-.4*hardMul(),stomp:true,harm:true,shoot:true,mode:'walk',hp:2});break;
    case 'x':ground(12,20);Object.assign(e,{stomp:true,harm:true,shoot:true,hp:3,cd:ri(40,90)});break;
    case 'n':ground(12,20);Object.assign(e,{vx:-1.25*hardMul(),stomp:true,harm:true,shoot:true});break;
    case 't':Object.assign(e,{w:20,h:1,x:s.tx*16+6,base:s.ty*16,y:s.ty*16,rise:0,ph:'hide',pt:60,hp:3,noGrav:true});break;
    case 'w':Object.assign(e,{w:16,h:16,x:s.tx*16,y:s.ty*16,hp:8,harm:true,shoot:true,cd:70,ang:Math.PI});break;
    case 'b':Object.assign(e,{w:14,h:10,x:s.tx*16,y:s.ty*16,y0:s.ty*16,vx:-.7*hardMul(),stomp:true,harm:true,shoot:true});break;
    case 'pod':Object.assign(e,{w:16,h:10,x:cam.x+W+8,y:s.ty*16,y0:s.ty*16,vx:-1.1,hp:2,shoot:true});break;
    case 'cp':Object.assign(e,{w:10,h:40,x:s.tx*16+3,y:s.ty*16-40,decor:true,on:G.cp!=null&&G.cp>=s.tx});break;
    case 'btn':Object.assign(e,{w:14,h:14,x:s.tx*16+1,y:s.ty*16-14,decor:true});break;}
  ents.push(e);}
function spawnCheck(){while(MAP.si<MAP.spawns.length&&MAP.spawns[MAP.si].tx*16<cam.x+W+32){const s=MAP.spawns[MAP.si++];if(s.tx*16<cam.x-16&&s.type!=='cp')continue;spawnEnt(s);}}
function shootAt(x,y,spd,quant,kind){let a=Math.atan2(P.y+P.h/2-y,P.x+P.w/2-x);if(quant){const q=Math.PI*2/quant;a=Math.round(a/q)*q;}spd*=hardMul();
  ebullets.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:2,life:260,kind:kind||'orb'});}
function boom(x,y,r){parts.push({k:'boom',x,y,t:0,life:18,r:r||8});}
function killEnt(e,how,src){
  e.harm=false;e.shoot=false;const cx=e.x+e.w/2,cy=e.y;
  if(e.type==='pod'){e.dead=true;boom(cx,e.y+5,10);SFX.boom(false);items.push({k:'cap',letter:['S','L','F','R'][ri(0,3)],x:e.x,y:e.y,w:14,h:14,vx:.6,vy:-3,t:0});addScore(500,cx,cy);return;}
  if(e.type==='t'||e.type==='w'){e.dead=true;boom(cx,e.y+e.h/2,12);SFX.boom(false);addScore(e.type==='w'?800:300,cx,cy);return;}
  e.dying=true;e.vy=-3;e.vx=((src&&src.dir)||1)*.8;boom(cx,e.y+e.h/2,6);SFX.stomp();
  addScore(how==='shell'?400:e.type==='x'?300:e.type==='k'?200:100,cx,cy);}
function damage(e,dmg,src){e.hp-=dmg;e.flash=4;SFX.hit();if(e.hp<=0)killEnt(e,'shot',src);}
function stomp(e){
  P.vy=keys.jump?-6.4:-4.2;P.ball=true;P.chain++;
  const pts=[100,200,400,500,800,1000,2000,4000,5000,8000];if(P.chain>=10)oneUp(e.x,e.y);else addScore(pts[P.chain-1],e.x+e.w/2,e.y);
  const bi=beatInfo();if(Math.abs(bi.off)<.12){addGroove(12);pops.push({x:P.x+P.w/2,y:P.y-6,s:'♪',t:0});}else addGroove(4);SFX.stomp();
  if(e.type==='g'){e.squash=30;e.harm=false;e.shoot=false;}
  else if(e.type==='k'){if(e.mode==='walk'){e.mode='shell';e.y+=3;e.h=12;e.vx=0;e.wake=480;}else if(e.mode==='slide'){e.mode='shell';e.vx=0;e.wake=480;}}
  else{e.harm=false;e.shoot=false;e.dying=true;e.vy=-1;e.vx=0;}}
function kickShell(e){const dir=P.x+P.w/2<e.x+e.w/2?1:-1;e.mode='slide';e.vx=dir*3.6;e.kickGrace=12;SFX.kick();addScore(400,e.x+e.w/2,e.y);if(P.vy>0&&P.y+P.h-P.vy<=e.y+5)P.vy=-3.6;}
function contact(e){
  if(e.type==='k'&&e.mode==='shell'){kickShell(e);return;}
  if(P.star>0){killEnt(e,'star',{dir:P.face});return;}
  const above=P.vy>0&&(P.y+P.h-P.vy)<=e.y+5;
  if(e.stomp&&above){stomp(e);return;}
  if(e.type==='k'&&e.mode==='slide'&&e.kickGrace>0)return;
  hurtPlayer();}
const AI={
  g(e){entPhys(e,true);e.face=sign(e.vx)||e.face;},
  k(e){if(e.mode==='walk'){entPhys(e,true);e.face=sign(e.vx)||e.face;}
    else if(e.mode==='shell'){e.vx=0;entPhys(e,false);if(--e.wake<=0){e.mode='walk';e.y-=3;e.h=15;e.vx=(P.x<e.x?-.4:.4)*hardMul();}}
    else{if(e.kickGrace>0)e.kickGrace--;entPhys(e,true);if(e.x<cam.x-60||e.x>cam.x+W+60)e.dead=true;
      for(const o of ents)if(o!==e&&!o.dead&&!o.dying&&o.shoot&&!o.squash&&overlap(e,o)){killEnt(o,'shell',{dir:sign(e.vx)});}}},
  x(e){entPhys(e,false);e.face=P.x<e.x?-1:1;e.aim=Math.atan2(P.y+P.h/2-(e.y+7),P.x+P.w/2-(e.x+e.w/2));
    if(Math.abs(P.x-e.x)<210&&onScreen(e)){e.cd--;if(e.cd===22)e.warn=22;if(e.cd<=0){shootAt(e.x+e.w/2+e.face*6,e.y+7,1.6,8);e.cd=G.hard?72:105;}}if(e.warn>0)e.warn--;},
  n(e){entPhys(e,false);e.face=sign(e.vx);if(e.onGround){if(e.hitWall)e.vy=-5.2;else{const ax=e.vx>0?e.x+e.w+4:e.x-4;const bl=tileAt(Math.floor(ax/16),Math.floor((e.y+e.h+4)/16));if(!SOLID(bl)&&!ONEW(bl))e.vy=-5.2;}}},
  t(e){const pcx=P.x+P.w/2,ecx=e.x+e.w/2;e.pt--;
    if(e.ph==='hide'){e.rise=0;if(e.pt<=0&&Math.abs(pcx-ecx)>30){e.ph='up';}}
    else if(e.ph==='up'){e.rise=Math.min(24,e.rise+1);if(e.rise>=24){e.ph='stay';e.pt=110;}}
    else if(e.ph==='stay'){if(e.pt===80||e.pt===40)shootAt(ecx,e.base-18,1.5,16);if(e.pt<=0)e.ph='down';}
    else{e.rise=Math.max(0,e.rise-1);if(e.rise<=0){e.ph='hide';e.pt=90;}}
    e.y=e.base-e.rise;e.h=Math.max(1,e.rise);e.harm=e.shoot=e.rise>4;},
  w(e){const cx=e.x+8,cy=e.y+8;const ta=Math.atan2(P.y+P.h/2-cy,P.x+P.w/2-cx);const q=Math.PI/8;e.ang=Math.round(ta/q)*q;
    if(onScreen(e)){e.cd--;if(e.cd<=0){ebullets.push({x:cx+Math.cos(e.ang)*10,y:cy+Math.sin(e.ang)*10,vx:Math.cos(e.ang)*1.6*hardMul(),vy:Math.sin(e.ang)*1.6*hardMul(),r:2,life:260,kind:'orb'});e.cd=G.hard?65:90;}}},
  b(e){e.x+=e.vx;e.y=e.y0+Math.sin(e.t*.06)*14;e.face=-1;if(e.x<cam.x-60)e.dead=true;},
  pod(e){e.x+=e.vx;e.y=e.y0+Math.sin(e.t*.05)*20;if(e.x<cam.x-40)e.dead=true;},
  cp(e){if(!e.on&&P.x>e.x-4){e.on=true;G.cp=e.tx;SFX.cp();for(let i=0;i<5;i++)pops.push({x:e.x+5+rnd(-8,8),y:e.y-4-i*3,s:'♪',t:-i*5});}},
  btn(e){if(!e.pressed&&!P.dead&&overlap(P,e)){e.pressed=true;SFX.eject();startCollapse();}},
};
function updEnts(){for(const e of ents){if(e.dead)continue;e.t++;if(e.flash>0)e.flash--;
    if(e.dying){e.vy+=.3;e.x+=e.vx;e.y+=e.vy;if(e.y>cam.y+H+40)e.dead=true;continue;}
    if(e.squash){if(--e.squash<=0)e.dead=true;continue;}
    AI[e.type](e);
    if(e.harm&&!P.dead&&!P.pipe&&overlap(P,e))contact(e);
    if(!e.decor&&e.x<cam.x-W)e.dead=true;}
  ents=ents.filter(e=>!e.dead);}

// ================= bullets
function bulletBox(b){if(b.len){const sp=Math.hypot(b.vx,b.vy)||1,tx=b.x-b.vx/sp*b.len,ty=b.y-b.vy/sp*b.len;return{x:Math.min(b.x,tx)-2,y:Math.min(b.y,ty)-2,w:Math.abs(b.x-tx)+4,h:Math.abs(b.y-ty)+4};}
  return{x:b.x-b.r-1,y:b.y-b.r-1,w:b.r*2+2,h:b.r*2+2};}
function updBullets(){
  for(const b of bullets){b.life--;
    if(b.kind==='F'){b.x+=b.vx;if(SOLID(tileAt(Math.floor(b.x/16),Math.floor(b.y/16)))){b.dead=true;parts.push({k:'spark',x:b.x,y:b.y,vx:0,vy:-.5,t:0,life:8,c:'#ffb03d'});continue;}
      b.vy+=.28;if(b.vy>4)b.vy=4;b.y+=b.vy;const c=tileAt(Math.floor(b.x/16),Math.floor((b.y+b.r)/16));if(b.vy>0&&(SOLID(c)||ONEW(c))){b.y=Math.floor((b.y+b.r)/16)*16-b.r;b.vy=-2.8;if(++b.bounces>5)b.dead=true;}}
    else{b.x+=b.vx;b.y+=b.vy;if(b.kind==='S'&&b.r<3.5)b.r+=.04;if(SOLID(tileAt(Math.floor(b.x/16),Math.floor(b.y/16)))){b.dead=true;parts.push({k:'spark',x:b.x,y:b.y,vx:0,vy:-.3,t:0,life:8,c:'#fff6d8'});continue;}}
    if(b.life<=0||b.x<cam.x-24||b.x>cam.x+W+24||b.y<cam.y-40||b.y>cam.y+H+24){b.dead=true;continue;}
    const bb=bulletBox(b);
    for(const e of ents){if(e.dead||e.dying||!e.shoot||(b.hit&&b.hit.has(e)))continue;if(overlap(bb,e)){damage(e,b.dmg,{dir:sign(b.vx)||1});if(b.pierce)b.hit.add(e);else{b.dead=true;break;}}}
    if(b.dead)continue;
    for(const e of ebullets){if(e.hp&&!e.dead&&overlap(bb,{x:e.x-e.r,y:e.y-e.r,w:e.r*2,h:e.r*2})){e.hp-=b.dmg;if(e.hp<=0){e.dead=true;boom(e.x,e.y,5);addScore(50);}if(!b.pierce){b.dead=true;break;}}}
    if(b.dead)continue;
    if(boss&&!boss.dying)for(const pt of bossParts(boss)){if(pt.dead||pt.armor||(b.hit&&b.hit.has(pt.ref)))continue;if(overlap(bb,pt)){bossDamage(pt,b.dmg);parts.push({k:'spark',x:b.x,y:b.y,vx:rnd(-1,1),vy:-1,t:0,life:8,c:'#fff'});if(b.pierce)b.hit.add(pt.ref);else{b.dead=true;break;}}
      else if(pt.shieldBox&&overlap(bb,pt.shieldBox)&&!b.pierce){b.dead=true;parts.push({k:'spark',x:b.x,y:b.y,vx:-1,vy:-1,t:0,life:8,c:'#3ff0ff'});break;}}}
  bullets=bullets.filter(b=>!b.dead);
  const hb={x:P.x+2,y:P.y+2,w:P.w-4,h:P.h-3};
  for(const e of ebullets){e.life--;
    if(e.g)e.vy+=e.g;e.x+=e.vx;e.y+=e.vy;
    if(e.kind==='wave'&&SOLID(tileAt(Math.floor(e.x/16),Math.floor(e.y/16))))e.dead=true;
    if(e.life<=0||e.x<cam.x-40||e.x>cam.x+W+40||e.y>cam.y+H+30||e.y<cam.y-80)e.dead=true;
    if(!e.dead&&!P.dead&&!P.pipe){const nx=clamp(e.x,hb.x,hb.x+hb.w),ny=clamp(e.y,hb.y,hb.y+hb.h);if((nx-e.x)**2+(ny-e.y)**2<e.r*e.r){if(P.star<=0&&P.inv<=0){e.dead=true;hurtPlayer();}}}}
  ebullets=ebullets.filter(e=>!e.dead);}

// ================= bosses
function makeBoss(ar){const hp=m=>Math.round(m*(G.hard?1.35:1));
  if(ar.boss==='crab'){const b={kind:'crab',name:'CRAB-O-TRON 3000',x:(ar.x1-6)*16,y:160-36,w:56,h:36,vx:0,vy:0,hp:hp(90),t:0,st:'intro',stT:0,flash:0,face:-1,cyc:0,shots:0};b.max=b.hp;return b;}
  if(ar.boss==='citadel'){const wx=(ar.x1-3)*16;const b={kind:'citadel',name:'RADIO CITADEL',wx,x:wx,y:16,w:48,h:144,t:0,st:'intro',stT:0,door:0,
    parts:[{id:'gunA',x:wx-12,y:44,w:20,h:14,hp:hp(26),cd:40},{id:'gunB',x:wx-12,y:90,w:20,h:14,hp:hp(26),cd:85},{id:'core',x:wx+2,y:118,w:22,h:26,hp:hp(60)}]};
    b.parts.forEach(p=>{p.max=p.hp;p.ref=p;p.flash=0;});b.max=b.parts.reduce((s,p)=>s+p.max,0);b.hp=b.max;return b;}
  const [bx0,bx1]=ar.bridge;const b={kind:'voltar',name:'KING VOLTAR',x:(bx1-4)*16,y:160-44,w:36,h:44,vx:0,vy:0,hp:hp(150),t:0,st:'intro',stT:0,flash:0,face:-1,cyc:0,bx0,bx1,shots:0};b.max=b.hp;return b;}
function bossParts(b){
  if(b.kind==='citadel'){const shielded=b.parts[0].hp>0||b.parts[1].hp>0;return b.parts.map(p=>({x:p.x,y:p.y,w:p.w,h:p.h,ref:p,dead:p.hp<=0,armor:p.id==='core'&&shielded,shieldBox:p.id==='core'&&shielded?{x:p.x-8,y:p.y-8,w:p.w+10,h:p.h+16}:null}));}
  if(b.kind==='crab')return[{x:b.x+6,y:b.y+8,w:b.w-12,h:b.h-8,ref:b}];
  return[{x:b.x+4,y:b.y+4,w:b.w-8,h:b.h-4,ref:b}];}
function bossDamage(pt,dmg){const b=boss;SFX.hit();
  if(b.kind==='citadel'){const p=pt.ref;p.hp-=dmg;p.flash=4;b.hp=b.parts.reduce((s,q)=>s+Math.max(0,q.hp),0);
    if(p.hp<=0&&!p.boomed){p.boomed=true;boom(p.x+p.w/2,p.y+p.h/2,16);SFX.boom(true);G.shake=6;addScore(2000,p.x,p.y);
      if(p.id!=='core'&&b.parts[0].hp<=0&&b.parts[1].hp<=0)banner('SHIELD DOWN!',80);}
    if(b.parts[2].hp<=0)bossDie();return;}
  b.hp-=dmg;b.flash=4;if(b.hp<=0)bossDie();}
function bossDie(){if(boss.dying)return;boss.dying=150;ebullets=[];SFX.boom(true);G.shake=10;addScore(10000,boss.x+boss.w/2,boss.y);stopMusic();
  for(const e of ents)if(!e.decor&&!e.dead&&!e.dying&&e.shoot)killEnt(e,'shot',{dir:-1});}
function startCollapse(){MAP.collapse={x:MAP.arena.bridge[1],t:0};stopMusic();}

  G.time++;const bi=beatInfo();const idx=Math.floor(now()/(bi.bd||.6));if(bi.phase<G.beat)G.beatIdx++;G.beat=bi.phase;void idx;
  if(G.banner&&--G.banner.d<=0)G.banner=null;if(G.shake>0)G.shake*=.85;if(G.shake<.3)G.shake=0;

  switch(G.state){
    case 'title':{cam.x+=.4;playTrack('title');
      if(SAVE.sideB&&(pressed.up||pressed.down)){G.sel^=1;SFX.select();}
      if(go){SFX.select();startGame(SAVE.sideB&&G.sel===1);}break;}
    case 'intro':G.timer++;if(G.timer>170||(G.timer>30&&go))beginPlay();break;
    case 'play':{

      checkArena();checkGoal();if(G.state==='play')updateCamera();break;}
    case 'pause':if(pressed.pause||pressed.start){G.state='play';seq.paused=false;seq.next=now()+.05;SFX.pause();}break;
    case 'dying':{G.timer++;P.vy+=.25;P.x+=P.vx;P.y+=P.vy;if(G.timer===20)P.vx=0;updParts();

    case 'rewind':{G.timer++;const cpx=G.cp!=null?G.cp:MAP===MAIN?MAIN.start:MAIN.start;const tgt=clamp(cpx*16+3-W*.4,0,MAIN.w*16-W);

    case 'flag':updateFlag();break;

    case 'over':G.timer++;if(G.timer>60&&go){G.lives=3;G.score=0;G.carry=null;G.cp=null;G.state='intro';G.timer=0;loadLevel(G.lvl,null);}break;
    case 'victory':{G.timer++;updParts();if(G.timer%10===0&&G.timer<150){const fx=cam.x+rnd(30,W-30),fy=rnd(20,90);for(let i=0;i<20;i++){const a=i/20*Math.PI*2;parts.push({k:'spark',x:fx,y:fy,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,t:0,life:40,c:RAIN[i%6],grav:.03});}SFX.boom(false);}
      if(G.timer>240){G.state='ending';G.timer=0;G.endLine=0;G.endChar=0;playTrack('ending');if(G.score>SAVE.best)SAVE.best=G.score;SAVE.sideB=true;persist();}break;}
    case 'ending':{G.timer++;cam.x+=.25;const lines=ENDING;
      if(G.endLine<lines.length){G.endChar+=.7;if(go){if(G.endChar<lines[G.endLine].length)G.endChar=999;else{G.endLine++;G.endChar=0;}}}

  }

function drawParts(cx,cy){for(const p of parts){const x=p.x-cx,y=p.y-cy,k=p.t/p.life;

function render(){

function fit(){const touch=document.body.classList.contains('touch');const land=touch&&innerWidth>innerHeight&&innerHeight<520;
  const vw=innerWidth-32,vh=innerHeight-(touch?(land?16:250):90);let s=Math.min(vw/W,vh/H);s=s>=2?Math.floor(s):Math.max(.8,s);

addEventListener('resize',fit);fit();
let last=performance.now(),acc=0;
function frame(t){requestAnimationFrame(frame);let dt=Math.min(100,t-last);last=t;acc+=dt;let n=0;while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}if(n>=5)acc=0;seqTick();render();}
if(document.fonts&&document.fonts.load)document.fonts.load(FONT).catch(()=>{});
cam.x=0;
requestAnimationFrame(frame);
})();

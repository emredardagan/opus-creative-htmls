<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paw Crossing</title>
<meta name="description" content="Hop a little animal through six seasons of roads, rivers, railways, frozen lakes, stampedes and storms. A 3D arcade game built with Kenney's CC0 models.">
<meta name="theme-color" content="#bfe7ff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/kit/toybox.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  .score b { font-size: 34px; }
  .coins b { color: #e8a200; }
  .coin-dot { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3a8, #ffc23d 45%, #e39a00); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }

  .title-screen { align-content: space-between; }
  .logo { text-align: center; margin-top: 4vh; }
  .logo h1 { margin: 0; font-size: clamp(48px, 11vw, 96px); line-height: .9; font-weight: 700; color: #fff; -webkit-text-stroke: 10px var(--tb-ink); paint-order: stroke fill; letter-spacing: -.01em; transform: rotate(-3deg); }
  .logo h1 span { color: var(--tb-accent-2); }
  .logo p { margin: 14px 0 0; font-weight: 600; color: var(--tb-ink); background: var(--tb-card); display: inline-block; padding: 6px 14px; border-radius: 99px; box-shadow: var(--tb-shadow); }
  .picker { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 4vh; }
  .pick-row { display: flex; align-items: center; gap: 14px; }
  .pet-name { min-width: 150px; text-align: center; font-size: 22px; font-weight: 700; background: var(--tb-card); border-radius: 99px; padding: 8px 18px; box-shadow: var(--tb-shadow); }
  .hint { font-size: 14px; color: var(--tb-ink); opacity: .75; font-weight: 500; }

  .over h2 { margin: 0; font-size: 40px; line-height: 1; }
  .over .why { margin: 6px 0 18px; color: var(--tb-dim); font-weight: 500; }
  .stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 22px; }
  .stat { background: #f3f5fb; border-radius: 16px; padding: 10px 16px; min-width: 92px; }
  .stat small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tb-dim); font-weight: 600; }
  .stat b { font-size: 30px; }
  .stat.new { background: #fff4d6; }
  .stat.new small::after { content: " · new!"; color: var(--tb-accent); }
  .over .actions { display: flex; gap: 10px; justify-content: center; align-items: center; }
  .tb-cta.alt { background: #fff; color: var(--tb-ink); box-shadow: 0 6px 0 #d5d8e4, 0 16px 30px -12px rgba(43,45,66,.4); font-size: 18px; padding: 14px 20px; display: inline-flex; gap: 8px; align-items: center; }
  .tb-cta.alt.glow { animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 6px 0 #d5d8e4, 0 0 0 6px rgba(255,194,61,.55); } }
  .tb-cta[disabled] { filter: grayscale(.7); opacity: .85; cursor: default; }
  .tb-cta.nope { animation: nope .35s; }
  @keyframes nope { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .tb-cta .coin-dot, .tb-cta .ph-bold { vertical-align: -3px; display: inline-block; }
  .unlock-hint { margin: 12px 0 0; font-weight: 600; color: #c07a00; font-size: 14px; }

  /* missions */
  .missions { display: grid; gap: 8px; text-align: left; margin: 0 0 18px; }
  .missions h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tb-dim); display: flex; align-items: center; gap: 6px; }
  .mission { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; align-items: center; background: #f3f5fb; border-radius: 14px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
  .mission > i { font-size: 18px; color: var(--tb-accent); }
  .mission em { font-style: normal; font-size: 13px; color: #c07a00; display: flex; align-items: center; gap: 4px; }
  .mission em .coin-dot { width: 14px; height: 14px; }
  .mission .bar { grid-column: 2 / 4; height: 6px; border-radius: 99px; background: #e2e5ef; overflow: hidden; }
  .mission .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--tb-accent-2), var(--tb-accent)); }
  .mission.done { background: #e3f8eb; }
  .mission.done > i { color: var(--tb-good); }
  .mission.done .bar i { background: var(--tb-good); }
  .title-missions { pointer-events: auto; background: var(--tb-card); border-radius: 22px; padding: 12px; box-shadow: var(--tb-shadow); width: min(320px, calc(100vw - 32px)); margin: 0; position: fixed; left: 16px; bottom: max(36px, env(safe-area-inset-bottom)); }
  .missions-btn { display: none; position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; gap: 6px; cursor: pointer; border: 0; font: 600 15px var(--tb-font); color: var(--tb-ink); }
  .missions-btn i { color: var(--tb-accent); font-size: 18px; }
  @media (max-width: 900px) {
    .missions-btn { display: flex; }
    .title-missions { display: none; top: calc(max(14px, env(safe-area-inset-top)) + 54px); bottom: auto; z-index: 5; }
    .title-missions.open { display: grid; }
  }
  .title-missions .mission { padding: 6px 10px; font-size: 13px; }

  /* title extras */
  .title-bank { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; }
  .title-bank b { color: #e8a200; font-size: 20px; }
  .collection { font-size: 13px; font-weight: 600; color: var(--tb-ink); opacity: .7; margin-top: -6px; display: flex; gap: 5px; align-items: center; }
  .price-tag { font-size: 13px; font-weight: 700; color: #c07a00; background: #fff4d6; border-radius: 99px; padding: 2px 10px; margin-top: -6px; }

  /* power-up pills + toasts */
  .tb-pill.power { gap: 6px; }
  .tb-pill[hidden] { display: none; }
  .tb-pill.power i { font-size: 20px; }
  .tb-pill.power.shield i { color: #ff5d8a; }
  .tb-pill.power.magnet i { color: #8a5cff; }
  .toast { position: fixed; left: 50%; top: max(84px, calc(env(safe-area-inset-top) + 74px)); transform: translate(-50%, -20px); opacity: 0; background: var(--tb-card); border-radius: 99px; padding: 10px 18px; box-shadow: var(--tb-shadow); font-weight: 700; display: flex; gap: 8px; align-items: center; z-index: 15; transition: transform .35s cubic-bezier(.2,1.4,.4,1), opacity .25s; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast i { color: var(--tb-good); font-size: 20px; }
  .toast em { font-style: normal; color: #c07a00; }
  .flash { position: fixed; inset: 0; background: #eef3ff; opacity: 0; pointer-events: none; z-index: 3; }
  .flash.on { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .55; } 15% { opacity: .1; } 25% { opacity: .4; } 100% { opacity: 0; } }
  .zone { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 14; opacity: 0; }
  .zone.show { animation: zone 2.6s ease forwards; }
  .zone b { display: block; font-size: clamp(34px, 8vw, 60px); color: #fff; -webkit-text-stroke: 8px var(--tb-ink); paint-order: stroke fill; transform: rotate(-3deg); white-space: nowrap; }
  .zone small { display: inline-block; margin-top: 6px; background: var(--tb-card); border-radius: 99px; padding: 4px 12px; font-weight: 600; font-size: 14px; box-shadow: var(--tb-shadow); }
  @keyframes zone { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
  @media (prefers-reduced-motion: reduce) { .zone.show { animation-duration: .01s; animation-name: none; opacity: 1; } .tb-cta.alt.glow, .tb-cta.nope { animation: none; } }

  .home-link { display: block; margin-top: 14px; color: var(--tb-dim); font-weight: 600; font-size: 14px; }

  .credit { position: fixed; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 11px; color: rgba(43,45,66,.55); pointer-events: auto; white-space: nowrap; }
  .credit a { color: inherit; }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 18px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js",
    "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@2.0.1/dist/N8AO.js"
  }
}
</script>
</head>
<body>
<canvas class="tb-stage" id="stage"></canvas>

<div class="tb-hud" id="hud" hidden>
  <div class="tb-row">
    <div class="tb-pill score"><div><small>Score</small><b id="score">0</b></div></div>
    <div class="tb-pill"><div><small>Best</small><b id="best" style="font-size:20px">0</b></div></div>
  </div>
  <div class="tb-row">
    <div class="tb-pill power shield" id="shieldPill" hidden><i class="ph-bold ph-heart"></i><b>×1</b></div>
    <div class="tb-pill power magnet" id="magnetPill" hidden><i class="ph-bold ph-magnet"></i><b id="magnetT">8</b></div>
    <div class="tb-pill coins"><span class="coin-dot"></span><b id="coins">0</b></div>
    <button class="tb-btn" id="mute" aria-label="Sound on/off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  </div>
</div>

<div class="tb-overlay title-screen" id="title" hidden>
  <div class="logo">
    <h1>Paw<br><span>Crossing</span></h1>
    <p>Hop across roads and rivers. Don't look back.</p>
  </div>
  <button class="tb-pill missions-btn" id="missionsBtn" aria-expanded="false" aria-controls="titleMissions"><i class="ph-bold ph-target" aria-hidden="true"></i><span>Missions</span></button>
  <div class="missions title-missions" id="titleMissions"></div>
  <div class="tb-pill title-bank"><span class="coin-dot"></span><b id="titleBank">0</b></div>
  <div class="picker">
    <div class="pick-row">
      <button class="tb-btn" id="prev" aria-label="Previous animal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="pet-name" id="petName">Dog</div>
      <button class="tb-btn" id="next" aria-label="Next animal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="collection" id="collection"></div>
    <button class="tb-cta" id="play">Let's go!</button>
    <div class="hint">Arrows / WASD or swipe · tap to hop forward</div>
  </div>
</div>

<div class="tb-overlay" id="over" hidden>
  <div class="tb-panel over">
    <h2 id="overTitle">Squashed!</h2>
    <p class="why" id="overWhy">That taxi was not stopping.</p>
    <div class="stats">
      <div class="stat" id="statScore"><small>Score</small><b id="finalScore">0</b></div>
      <div class="stat"><small>Coins</small><b id="finalCoins">0</b></div>
    </div>
    <div class="missions" id="overMissions"></div>
    <div class="actions">
      <button class="tb-cta" id="retry">Hop again</button>
      <button class="tb-cta alt" id="toPets"><i class="ph-bold ph-paw-print" aria-hidden="true"></i>Pets</button>
    </div>
    <p class="unlock-hint" id="unlockHint" hidden>You have enough coins for a new pet!</p>
    <a class="home-link" href="index.html">← All games</a>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="flash" id="flash"></div>
<div class="zone" id="zone"><b id="zoneName"></b><small id="zoneSub"></small></div>

<div class="tb-loading" id="loading"><div class="bar"><i id="loadBar"></i></div></div>
<div class="credit">3D models by <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a> (CC0) · sky by <a href="https://polyhaven.com" target="_blank" rel="noopener">Poly Haven</a></div>

<script type="module">
import {
  THREE, createStage, kenney, preload, loaded, cloneLoaded, Bursts, popText, Sfx,
  damp, easeOutBack, store, PALETTE,
} from './assets/kit/toybox.js';

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let stage;
try { stage = createStage({ canvas: $('stage') }); }
catch (e) { document.body.insertAdjacentHTML('beforeend', '<div class="fallback">Paw Crossing needs WebGL. Try a recent Chrome, Safari or Firefox.</div>'); throw e; }
const { scene, camera } = stage;

// ---------- assets ----------
// the collection: four starters, then pets you buy with coins
const PETS = ['dog', 'cat', 'bunny', 'chick',
  'fox', 'pig', 'cow', 'penguin', 'panda', 'beaver', 'hog', 'koala', 'monkey', 'deer',
  'lion', 'tiger', 'polar', 'parrot', 'elephant', 'giraffe', 'bee', 'crab',
  'caterpillar', 'fish'];
const STARTERS = PETS.slice(0, 4);
const RARE = ['lion', 'tiger', 'polar', 'parrot', 'elephant', 'giraffe', 'bee', 'crab'];
const LEGEND = ['caterpillar', 'fish'];
const price = n => STARTERS.includes(n) ? 0 : LEGEND.includes(n) ? 500 : RARE.includes(n) ? 250 : 100;
const owned = new Set(store.get('paw.owned', STARTERS));
const CARS = ['sedan', 'taxi', 'police', 'van', 'suv', 'hatchback-sports', 'sedan-sports', 'suv-luxury', 'delivery', 'truck', 'ambulance', 'firetruck', 'garbage-truck'];
const TREES = ['tree_default', 'tree_oak', 'tree_pineRoundA', 'tree_pineRoundC', 'tree_detailed', 'tree_fat', 'tree_simple', 'tree_cone', 'tree_blocks'];
const ROCKS = ['rock_largeA', 'rock_largeC', 'stump_round', 'stump_roundDetailed', 'plant_bushLarge', 'plant_bushDetailed'];
const FLOWERS = ['flower_redA', 'flower_yellowA', 'flower_purpleA', 'flower_redB', 'flower_yellowB', 'mushroom_red', 'mushroom_tanGroup', 'plant_bushSmall'];
const LOCOS = ['train-locomotive-a', 'train-locomotive-b', 'train-diesel-a', 'train-electric-bullet-a'];
const WAGONS = ['train-carriage-container-red', 'train-carriage-container-blue', 'train-carriage-container-green', 'train-carriage-box', 'train-carriage-tank', 'train-carriage-lumber', 'train-carriage-coal'];
const P = {
  pet: n => kenney(`cube-pets/animal-${n}`),
  car: n => kenney(`car-kit/${n}`),
  nat: n => kenney(`nature-kit/${n}`),
  coin: kenney('platformer-kit/coin-gold'),
  log: kenney('nature-kit/log_large'),
  lily: kenney('nature-kit/lily_large'),
  lamp: kenney('city-kit-roads/light-square'),
  cone: kenney('city-kit-roads/construction-cone'),
  train: n => kenney(`train-kit/${n}`),
  track: kenney('train-kit/track-single-detailed'),
  plat: n => kenney(`platformer-kit/${n}`),
  boat: n => kenney(`watercraft-kit/${n}`),
  city: n => kenney(`city-kit-commercial/${n}`),
  surv: n => kenney(`survival-kit/${n}`),
};
const BOATS = ['boat-row-small', 'boat-fishing-small', 'boat-speed-a', 'boat-speed-e'];
// seasons: the land changes every ZONE_LEN rows. Each one has its own look, hazards and stampede.
//   water: what river rows become · herd: animals in the mid-season stampede · roads: vehicle mix
const ZONE_LEN = 40;
const CITY_CARS = ['taxi', 'taxi', 'police', 'sedan-sports', 'hatchback-sports', 'suv-luxury', 'van', 'race', 'race-future'];
const ZONES = [
  { name: 'Sunny Meadow', sub: 'Back where it all began', sky: 0xbfe7ff,
    grass: [0x9bd46a, 0x8cc75d, 0x86bd58, 0x7cb150],
    trees: TREES.map(P.nat), rocks: ROCKS.map(P.nat), flowers: FLOWERS.map(P.nat),
    water: 'logs', herd: ['cow', 'pig', 'cow', 'hog'], herdName: 'Stampede!', herdSub: 'The cows broke out of the farm',
    weather: ['night', 'storm'] },
  { name: 'Autumn Woods', sub: 'Mind the falling leaves', sky: 0xffe3c2,
    grass: [0xe2b04f, 0xd8a346, 0xcb9641, 0xbf8a3b],
    trees: ['tree_default_fall', 'tree_oak_fall', 'tree_detailed_fall', 'tree_fat_fall', 'tree_simple_fall', 'tree_cone_fall', 'tree_blocks_fall', 'tree_tall_fall'].map(P.nat),
    rocks: ['rock_largeA', 'stump_round', 'stump_roundDetailed', 'stump_old', 'log', 'crop_pumpkin'].map(P.nat),
    flowers: ['mushroom_red', 'mushroom_redGroup', 'mushroom_tanGroup', 'mushroom_tan', 'plant_bushSmall', 'flower_yellowB', 'crop_pumpkin'].map(P.nat),
    water: 'logs', farm: true, herd: ['deer', 'deer', 'fox', 'beaver'], herdName: 'Deer crossing!', herdSub: 'The whole forest is on the move',
    weather: ['night', 'storm'] },
  { name: 'Snowy Pass', sub: 'Brr! The lakes are frozen', sky: 0xdfeaf6,
    grass: [0xf2f6fb, 0xe6edf6, 0xdbe4ef, 0xcfd9e6],
    trees: ['tree-pine-snow', 'tree-snow', 'tree-pine-snow-small'].map(P.plat).concat(['tree_pineRoundA', 'tree_pineTallA'].map(P.nat)),
    rocks: ['rock-a', 'rock-b', 'rock-c'].map(P.surv).concat([P.plat('rocks')]),
    flowers: [P.plat('stones'), P.plat('tree-pine-snow-small')],
    water: 'ice', herd: ['penguin', 'polar', 'penguin', 'penguin'], herdName: 'Penguin parade!', herdSub: 'They waddle faster than you think',
    weather: ['night', 'blizzard'] },
  { name: 'Sandy Beach', sub: 'Watch out for crabs', sky: 0xc4f0ff,
    grass: [0xf6e2a8, 0xf0d99a, 0xe9cf8c, 0xe1c47f],
    trees: ['tree_palm', 'tree_palmBend', 'tree_palmTall', 'tree_palmShort', 'tree_palmDetailedTall'].map(P.nat),
    rocks: ['rock-sand-a', 'rock-sand-b', 'rock-sand-c'].map(P.surv).concat([P.city('detail-parasol-a'), P.city('detail-parasol-b')]),
    flowers: ['rock_smallFlatA', 'plant_bushSmall', 'grass'].map(P.nat),
    water: 'boats', hazard: 'crabs', herd: ['crab', 'crab', 'crab'], herdName: 'Crab rave!', herdSub: 'Sideways and very fast',
    weather: ['night', 'storm'] },
  { name: 'Cactus Canyon', sub: 'Tumbleweeds ahead', sky: 0xffd9a8,
    grass: [0xe9a86a, 0xe09d5f, 0xd28f55, 0xc6834c],
    trees: ['cactus_tall', 'cactus_short', 'rock_tallB', 'rock_tallE', 'rock_tallG'].map(P.nat),
    rocks: ['cactus_short', 'rock_tallA', 'rock_largeB', 'tent_smallOpen'].map(P.nat),
    flowers: ['rock_smallB', 'rock_smallE', 'plant_bushSmall', 'cactus_short'].map(P.nat),
    water: 'weeds', dirt: true, herd: ['elephant', 'giraffe', 'lion', 'elephant'], herdName: 'Safari rush!', herdSub: 'Elephants have right of way',
    weather: ['night'] },
  { name: 'Neon City', sub: 'The city never sleeps', sky: 0x2a2f5c, night: true,
    grass: [0xb6bac6, 0xadb1be, 0x9ea2af, 0x959aa7],
    trees: ['low-detail-building-a', 'low-detail-building-b', 'low-detail-building-c', 'low-detail-building-d', 'low-detail-building-e', 'low-detail-building-f', 'low-detail-building-g', 'low-detail-building-h'].map(P.city),
    rocks: ['tree_default', 'tree_simple', 'plant_bushLarge'].map(P.nat),
    flowers: ['plant_bushSmall', 'flower_redA', 'flower_yellowA'].map(P.nat),
    water: 'boats', city: true, herd: null, herdName: 'Rush hour!', herdSub: 'Everyone is late for something',
    weather: ['storm'] },
];
const NIGHT_SKY = 0x1b2246, STORM_SKY = 0x8794a8;
const zoneOf = i => i < 0 ? 0 : Math.floor(i / ZONE_LEN) % ZONES.length;
const phaseOf = i => i < 0 ? -1 : i % ZONE_LEN;
for (const z of ZONES) z.mats = z.grass.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .95 }));
const allPaths = [
  ...PETS.map(P.pet), ...CARS.map(P.car), ...TREES.map(P.nat), ...ROCKS.map(P.nat), ...FLOWERS.map(P.nat),
  P.coin, P.log, P.lily, P.lamp, P.cone, P.track,
  ...LOCOS.map(P.train), ...WAGONS.map(P.train),
  ...['heart', 'jewel', 'star', 'flag'].map(P.plat),
  ...ZONES.flatMap(z => [...z.trees, ...z.rocks, ...z.flowers]),
  ...['fence_simple', 'plant_bush', 'plant_bushDetailed', 'rock_largeA', 'rock_largeC'].map(P.nat),
  ...BOATS.map(P.boat), ...['tractor', 'tractor-shovel', 'truck-flat', 'delivery-flat', 'race', 'race-future'].map(P.car),
  ...['train-electric-city-a', 'train-electric-city-b', 'train-electric-city-c', 'train-electric-subway-a', 'train-electric-subway-b', 'train-electric-subway-c'].map(P.train),
];

const bursts = new Bursts(scene);
const sfx = new Sfx();
sfx.muted = store.get('paw.muted', false);

// ---------- world constants ----------
const HALF = 4;           // playable columns: -4..4
const WORLD = 13;         // visual half-width
const AHEAD = 26, BEHIND = 9;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

const mats = {

    const boats = waterKind === 'boats';

    if (lilyRow) {

      const speed = rand(1.1, 2.0) + Math.min(1.2, i / 120);
      const count = 3 + ((Math.random() * 2) | 0);
      const span = WORLD * 2 + 6, gap = span / count, offset = rand(0, gap);
      for (let k = 0; k < count; k++) {
        if (boats) {
          const b = fitted(P.boat(pick(BOATS)), pick([2.2, 2.6, 3]));

          // keep the boat inside its own lane

          if (size.z > 0.9) { b.scale.multiplyScalar(0.9 / size.z); size = new THREE.Box3().setFromObject(b).getSize(new THREE.Vector3()); }
          b.position.y = 0; ground(b);
          b.position.set(-WORLD - 3 + offset + k * gap, -0.3, 0);
          g.add(b);

  }

  rows.set(i, row);
  maxRowBuilt = Math.max(maxRowBuilt, i);
  return row;
}

function addProp(g, path, x, scale, collide = false) {
  const gl = loaded(path);

  const nature = path.includes('nature-kit');
  const small = path.includes('city-kit') || path.includes('survival-kit');
  const o = nature ? cloneLoaded(gl).object : fitted(path, small ? scale * 0.62 : scale);

function ensureRows(front) {
  while (maxRowBuilt < front + AHEAD) makeRow(maxRowBuilt + 1);
  for (const [i, row] of rows) if (i < front - BEHIND) { world.remove(row.group); rows.delete(i); }
}

  coins:  { text: n => `Grab ${n} coins in one run`, run: true, steps: [4, 6, 8, 10, 13, 16, 20] },
  roads:  { text: n => `Hop over ${n} road lanes`, steps: [10, 20, 35, 50, 75, 100] },
  logs:   { text: n => `Ride ${n} logs or boats`, steps: [5, 10, 18, 28, 40, 60] },
  boss:   { text: n => n > 1 ? `Survive ${n} stampedes` : 'Survive a stampede', steps: [1, 2, 3, 4] },
  night:  { text: n => `Hop ${n} rows in the dark`, steps: [10, 20, 35, 50] },
  slides: { text: n => `Slide ${n} tiles on ice`, steps: [6, 12, 20, 30] },
  rails:  { text: n => `Cross ${n} railways`, steps: [2, 4, 7, 10, 15, 22] },
  close:  { text: n => `Get ${n} close calls`, steps: [2, 4, 7, 10, 15] },
  powers: { text: n => `Pick up ${n} power-ups`, steps: [1, 2, 4, 6, 9] },
  speedy: { text: n => `Hit Speedy ×${n}`, run: true, steps: [4, 8, 12] },
  zone:   { text: n => `Reach ${ZONES[n].name}`, run: true, steps: [1, 2, 3, 4, 5] },
};
let mLevel = store.get('paw.mlevel', 0);
let missions = store.get('paw.missions', null);
function newMission(taken) {
  // only offer goals the player has seen: ice needs Snowy Pass, the dark and stampedes need a few rows
  const seen = { slides: best >= ZONE_LEN * 2, night: best >= 30, boss: best >= 15 };
  const types = Object.keys(MISSIONS).filter(t => !taken.includes(t) && seen[t] !== false);
  const type = pick(types), m = MISSIONS[type];
  const tier = Math.min(m.steps.length - 1, Math.floor(mLevel / 3) + ((Math.random() * 2) | 0));
  return { type, n: m.steps[tier], p: 0, reward: 10 + tier * 6, done: false };
}
function refreshMissions() {
  if (!Array.isArray(missions) || missions.length !== 3 || missions.some(m => !MISSIONS[m?.type])) missions = [];
  missions = missions.filter(m => !m.done);
  for (const m of missions) if (MISSIONS[m.type].run) m.p = 0;
  while (missions.length < 3) missions.push(newMission(missions.map(m => m.type)));
  store.set('paw.missions', missions);
}
// count progress; run missions take the best value this run, the rest add up across runs
function track(type, value = 1) {
  for (const m of missions) {
    if (m.type !== type || m.done) continue;
    m.p = MISSIONS[type].run ? Math.max(m.p, value) : m.p + value;
    if (m.p >= m.n) {
      m.p = m.n; m.done = true; mLevel++;
      bank += m.reward; store.set('paw.coins', bank); store.set('paw.mlevel', mLevel);
      $('coins').textContent = bank;
      toast(`<i class="ph-bold ph-check-circle"></i>${MISSIONS[type].text(m.n)} <em>+${m.reward}</em>`);
      [784, 988, 1318].forEach((f, k) => sfx.tone(f, 0.14, { type: 'square', vol: 0.08, delay: k * 0.09 }));
    }
  }
  store.set('paw.missions', missions);
}
function renderMissions(el, compact = false) {
  el.innerHTML = `<h3><i class="ph-bold ph-target" aria-hidden="true"></i>Missions</h3>` + missions.map(m => `
    <div class="mission${m.done ? ' done' : ''}">
      <i class="ph-bold ${m.done ? 'ph-check-circle' : 'ph-target'}" aria-hidden="true"></i>
      <span>${MISSIONS[m.type].text(m.n)}</span>
      <em>${m.done ? 'Done!' : `<span class="coin-dot"></span>${m.reward}`}</em>
      ${compact && m.done ? '' : `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${m.n}" aria-valuenow="${m.p}"><i style="width:${Math.round(m.p / m.n * 100)}%"></i></div>`}
    </div>`).join('');
}
let toastTimer = 0;

  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400);

function play(name, once = false) {
  if (!pl.actions) return;
  const a = pl.actions[name] || pl.actions.idle;
  for (const k in pl.actions) if (pl.actions[k] !== a) pl.actions[k].fadeOut(0.12);
  a.reset().fadeIn(0.12).setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity).play();
  a.clampWhenFinished = once;
}

function hop(dx, dz) {
  if (state !== 'play' || pl.dead) return;
  if (pl.t < 1) { pl.queue = [dx, dz]; return; }
  const baseX = Math.round(pl.x);
  const tx = baseX + dx, tr = pl.row + dz;
  pl.facing = dz > 0 ? Math.PI : dz < 0 ? 0 : dx > 0 ? Math.PI / 2 : -Math.PI / 2;
  const target = rows.get(tr);
  if (Math.abs(tx) > HALF || tr < Math.max(0, score - 12) || !target || target.blocked.has(tx)) {
    // bump: a little wobble, no move
    pl.squash = 0.6; sfx.tone(180, 0.08, { type: 'square', vol: 0.08 });
    return;
  }
  pl.fromX = pl.x; pl.fromZ = pl.row; pl.toX = tx; pl.toRow = tr; pl.t = 0;
  pl.dur = pl.hopDur; pl.arc = 0.45; pl.lastD = [dx, dz];
  pl.riding = null; pl.nudge = 0;
  sfx.tone(520 + Math.random() * 60, 0.09, { type: 'triangle', vol: 0.18, slide: 380 });
  bursts.emit(new THREE.Vector3(pl.x, 0.05, -pl.row), { tex: 'smoke_04', count: 4, color: 0xffffff, speed: [0.3, 0.8], up: [0.3, 0.8], life: [0.3, 0.5], size: [0.25, 0.4], gravity: -1, grow: 1.8 });
  if (dz > 0) {
    const now = performance.now();
    speedy = now - lastForward < 360 ? speedy + 1 : 0;
    lastForward = now;
    if (speedy === 4 || speedy === 8 || speedy === 12) { popText(stage, new THREE.Vector3(tx, 1.4, -tr), `Speedy ×${speedy}`, 'good'); track('speedy', speedy); }
  }
}

function landed() {
  pl.x = pl.toX; pl.row = pl.toRow; pl.squash = 1;
  const row = rows.get(pl.row);
  if (pl.row > score) {
    score = pl.row; $('score').textContent = score;
    ensureRows(score);
    idleT = 0; eagle.warned = false; eagleShadow.visible = false;
    track('score', score);
    if (row?.type === 'road') track('roads');
    if (row?.type === 'rail') track('rails');
    if (rows.get(score - 1)?.boss && !row?.boss) track('boss');
    if (nightF > 0.6) track('night');
    // warn about a set piece a few rows before it
    for (let k = 1; k <= 3; k++) {
      const ahead = rows.get(score + k);
      if (ahead?.boss && !ahead.announced) {
        for (let j = score + k; rows.get(j)?.boss; j++) rows.get(j).announced = true;
        const z = ZONES[ahead.zone];
        banner(z.herdName, z.herdSub);
        sfx.noise(1.2, { vol: 0.3, freq: 140, type: 'lowpass' }); sfx.tone(110, 0.5, { type: 'sawtooth', vol: 0.06, slide: -40 });
        if (!reduced) shake = 0.25;
        break;
      }
    }
    // new season: banner, bonus coins
    const z = Math.floor(score / ZONE_LEN);
    if (z > lastZone) {
      lastZone = z;
      const zone = ZONES[z % ZONES.length];
      banner(zone.name, 'Season bonus +5');
      addCoins(5, new THREE.Vector3(pl.x, 1, -pl.row));
      track('zone', z);
      [523, 659, 784, 1046, 1318].forEach((f, k) => sfx.tone(f, 0.2, { type: 'triangle', vol: 0.12, delay: k * 0.07 }));
    }
  }
  if (row?.type !== 'river') pl.safe = { x: pl.x, row: pl.row };
  // frozen lake: keep sliding the way you hopped until a rock, the edge or solid ground stops you
  if (row?.type === 'ice' && pl.lastD) {
    const [dx, dz] = pl.lastD, tx = Math.round(pl.x) + dx, tr = pl.row + dz, next = rows.get(tr);
    pl.queue = null;
    if (Math.abs(tx) <= HALF && next && !next.blocked.has(tx) && tr >= Math.max(0, score - 12)) {
      pl.fromX = pl.x; pl.fromZ = pl.row; pl.toX = tx; pl.toRow = tr; pl.t = 0; pl.dur = 0.13; pl.arc = 0.02;
      if (Math.random() < 0.5) sfx.noise(0.14, { vol: 0.08, freq: 5000, q: 0.4 });
      bursts.emit(new THREE.Vector3(pl.x, 0.05, -pl.row), { tex: 'circle_05', count: 2, color: 0xffffff, speed: [0.2, 0.5], up: [0.2, 0.6], size: [0.08, 0.14], life: [0.3, 0.5] });
      track('slides');
      return;
    }
    pl.squash = 0.5; sfx.tone(240, 0.06, { type: 'triangle', vol: 0.06 });
  }
  if (row?.coin && Math.round(pl.x) === Math.round(row.coin.position.x)) collectCoin(row);
  if (row?.power && Math.round(pl.x) === row.power.obj.position.x) collectPower(row);
  if (row?.type === 'river') {
    const m = supportAt(row, pl.x);
    if (!m) return die('water');
    pl.riding = m;
    // a paw on the very tip still counts: pull the pet back onto the log
    if (m.kind !== 'lily') {
      const mx = m.obj.position.x, inner = Math.max(0, m.len / 2 - 0.35);
      pl.nudge = Math.min(mx + inner, Math.max(mx - inner, pl.x)) - pl.x;
    }
    m.obj.userData.bob = 1;
    if (m.kind !== 'lily') track('logs');
    bursts.emit(new THREE.Vector3(pl.x, 0, -pl.row), { tex: 'circle_05', count: 6, color: 0xe8fbff, speed: [0.5, 1.2], up: [0.8, 1.5], size: [0.12, 0.22], life: [0.3, 0.5] });
  }
  if (pl.queue) { const q = pl.queue; pl.queue = null; hop(q[0], q[1]); }
}

    if (w === 'storm') toast('<i class="ph-bold ph-cloud-lightning" style="color:#5b6b8a"></i>A storm rolls in');

// ---------- main loop ----------
let lastT = performance.now(), elapsed = 0, ambientT = 0;
const skyCol = new THREE.Color();
const tmp = new THREE.Vector3();

  const viewRow = state === 'title' ? 0 : Math.round(camZ + 3);
  for (const [, row] of rows) {
    const inView = Math.abs(row.i - viewRow) < 16;
    if (inView) for (const mx of row.mixers) mx.update(dt);
    if (row.type === 'crabs') {
      // crabs scuttle sideways and change their minds
      for (const m of row.movers) {
        m.turn -= dt;
        if (m.turn <= 0 || Math.abs(m.obj.position.x) > HALF + 2.5) { m.vx = -Math.sign(m.obj.position.x || m.vx) * rand(1.2, 2.4) * (Math.abs(m.obj.position.x) > HALF + 2.5 ? 1 : (Math.random() < 0.5 ? 1 : -1)); m.turn = rand(1, 3); }

        m.down = m.obj.position.y < -0.3;
        if (warn && inView && Math.random() < dt * 14) bursts.emit(new THREE.Vector3(m.x + rand(-.3, .3), -0.1, -row.i + rand(-.3, .3)), { tex: 'circle_05', count: 1, color: 0xe8fbff, speed: [0, 0.1], up: [0.6, 1], size: [0.06, 0.12], life: [0.3, 0.5], gravity: 0 });
        if (m.down && pl.riding === m && !pl.dead) { pl.riding = null; die('water'); }

    }

      if (m.kind === 'herd') {

        m.spin.rotation.z -= row.dir * row.speed * dt / 0.38;
      }
      if (m.attach) for (const a of m.attach) a.obj.position.x = m.obj.position.x + a.dx;
    }
  }
  // trains: wait, ring the bell, then thunder across
  for (const [, row] of rows) {
    const tr = row.train;
    if (!tr) continue;
    const near = Math.abs(row.i - pl.row) < 9 && state === 'play';
    if (tr.state === 'wait') {
      tr.timer -= dt;
      if (tr.timer < 1.4) {
        const on = Math.floor(t * 6) % 2;
        tr.lamps[0].material.emissiveIntensity = on ? 3 : 0; tr.lamps[1].material.emissiveIntensity = on ? 0 : 3;
        tr.bell -= dt;
        if (near && tr.bell <= 0) { tr.bell = 0.33; sfx.tone(1568, 0.25, { type: 'triangle', vol: 0.07 }); sfx.tone(2093, 0.2, { type: 'sine', vol: 0.04 }); }
      }
      if (tr.timer <= 0) {
        tr.state = 'run'; tr.obj.visible = true;
        tr.x = -tr.dir * (WORLD + tr.len / 2 + 2);
        if (near) sfx.noise(0.9, { vol: 0.22, freq: 180, type: 'lowpass' });
      }
    } else {
      tr.x += tr.dir * 26 * dt;
      tr.obj.position.x = tr.x;
      tr.obj.position.y = 0.08 + Math.abs(Math.sin(t * 30)) * 0.01;
      if (Math.abs(tr.x) > WORLD + tr.len / 2 + 2.5) {
        tr.state = 'wait'; tr.obj.visible = false; tr.timer = rand(2.5, 6);
        tr.lamps[0].material.emissiveIntensity = tr.lamps[1].material.emissiveIntensity = 0;
      }
    }
  }
  // coins spin; the magnet pulls nearby ones in
  if (magnetT > 0 && state === 'play') magnetT = Math.max(0, magnetT - dt);
  for (const [, row] of rows) {
    if (row.coin) {
      const c = row.coin;
      c.rotation.y += dt * (magnetT > 0 ? 9 : 3); c.position.y = 0.35 + Math.sin(t * 3 + row.i) * 0.06;
      if (magnetT > 0 && !pl.dead) {
        const dx = pl.root.position.x - c.position.x, dz = pl.root.position.z - (-row.i + c.position.z), d = Math.hypot(dx, dz);
        if (d < 0.45) collectCoin(row);
        else if (d < 3.2) { const k = Math.min(1, dt * 9 / d); c.position.x += dx * k; c.position.z += dz * k; }
      }
    }
    if (row.power) {
      const { model, ring } = row.power;
      model.rotation.y += dt * 2; model.position.y = 0.45 + Math.sin(t * 3 + row.i) * 0.08;
      ring.scale.setScalar(1 + Math.sin(t * 4) * 0.12); ring.material.opacity = 0.4 + Math.sin(t * 4) * 0.15;
    }
  }

  // player hop
  if (state === 'play' || state === 'dead') {
    if (pl.t < 1 && !pl.dead) {
      pl.t = Math.min(1, pl.t + dt / pl.dur);
      const k = pl.t;
      pl.x = pl.fromX + (pl.toX - pl.fromX) * k;
      const z = pl.fromZ + (pl.toRow - pl.fromZ) * k;
      pl.root.position.set(pl.x, Math.sin(k * Math.PI) * pl.arc, -z);
      if (pl.t >= 1) landed();
    } else if (!pl.dead) {
      if (pl.riding && rows.get(pl.row)) {
        const row = rows.get(pl.row);
        pl.x += row.dir * row.speed * dt;
        if (pl.nudge) { const n = pl.nudge * Math.min(1, dt * 14); pl.x += n; pl.nudge -= n; }
        if (Math.abs(pl.x) > HALF + 0.6) die('drift');
      }
      pl.root.position.set(pl.x, pl.riding ? pl.riding.obj.position.y + (pl.riding.top ?? 0.3) : 0, -pl.row);
    }
    // squash & stretch
    pl.squash = Math.max(0, pl.squash - dt * 6);
    if (pl.body && !pl.dead) {
      const s = 0.5, q = Math.sin(pl.squash * Math.PI) * 0.18;
      const air = pl.t < 1 ? Math.sin(pl.t * Math.PI) * 0.12 : 0;
      pl.body.scale.set(s * (1 + q - air * .5), s * (1 - q + air), s * (1 + q - air * .5));
    }
    pl.root.rotation.y = damp(pl.root.rotation.y, pl.facing, 25, dt);
    if (sinking) { sinking = Math.max(0, sinking - dt); pl.root.position.y = -0.9 * (1 - sinking); }

    // collisions with cars (checked every frame, including mid-hop)
    // extra-life bubble, blink while invulnerable, power-up HUD
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (pl.body && !pl.dead) pl.body.visible = invuln === 0 || Math.floor(t * 14) % 2 === 0;
    bubble.material.uniforms.uTime.value = t;
    if (bubble.visible) bubble.scale.setScalar(damp(bubble.scale.x, pl.shield ? 1 + Math.sin(t * 5) * 0.03 : 0.01, 10, dt));
    if (!pl.shield && bubble.scale.x < 0.05) bubble.visible = false;
    $('shieldPill').hidden = !pl.shield || state !== 'play';
    $('magnetPill').hidden = magnetT <= 0;
    if (magnetT > 0) $('magnetT').textContent = Math.ceil(magnetT);

    if (!pl.dead && invuln === 0) {
      const r = Math.round(-pl.root.position.z);
      const row = rows.get(r);
      const tr = row?.train;
      if (tr?.state === 'run' && Math.abs(tr.x - pl.root.position.x) < tr.len / 2 + 0.3) die('train');
      const hit = { road: 'car', herd: 'herd', weeds: 'weed', crabs: 'crab' }[row?.type];
      if (hit) {
        for (const m of row.movers) {
          const d = Math.abs(m.obj.position.x - pl.root.position.x);
          if (d < m.len / 2 + 0.28) { die(hit, m); break; }
          if (row.dir && !m.close && d < m.len / 2 + 0.75 && Math.sign(pl.root.position.x - m.obj.position.x) === row.dir) {
            m.close = true;
            track('close');
            if (Math.random() < 0.5) popText(stage, new THREE.Vector3(pl.root.position.x, 1.5, -r), pick(['Close call!', 'Phew!', 'Whoosh!']), 'good');
            if (Math.random() < 0.4) sfx.tone(392, 0.18, { type: 'square', vol: 0.05 });
          }
        }
      }
    }

    // camera creeps forward once you start, so you can't dawdle forever
    if (state === 'play' && score > 0) camZ += dt * Math.min(1.1, 0.35 + score / 120);
    camZ = Math.max(camZ, damp(camZ, pl.row - 1, 3, dt));
  } else if (state === 'title') {
    pl.root.rotation.y = damp(pl.root.rotation.y, 0.35 + Math.sin(t * 0.8) * 0.35, 4, dt);
  }

  const visibility = updateWeather(dt, t);
  updateEagle(dt);

  camX = damp(camX, camera.aspect < 1 ? Math.max(-1, Math.min(1, pl.x * 0.3)) : Math.max(-2, Math.min(2, pl.x * 0.5)), 3, dt);
  const cz = state === 'title' ? 0 : -camZ;
  const sh = shake > 0 ? (shake -= dt, (Math.random() - 0.5) * shake * 0.6) : 0;
  const titleOff = state === 'title' ? 1 : 0;
  // pull back on tall, narrow screens so the whole 9-column playfield stays in view
  const zoom = Math.min(2.4, Math.max(1, 1.25 / camera.aspect));
  scene.fog.near = 28 * zoom * visibility; scene.fog.far = 60 * zoom * (0.4 + 0.6 * visibility);
  waterMat.uniforms.fogNear.value = scene.fog.near; waterMat.uniforms.fogFar.value = scene.fog.far;
  camera.position.set(camX + (3.2 + sh - titleOff * 0.6) * zoom, (10.5 - titleOff * 2) * zoom, cz + (7.2 - titleOff * 0.6) * zoom);
  camera.lookAt(camX + sh * 0.5, titleOff * 0.3, cz - 2.2 + titleOff * 1.6);
  for (const [, row] of rows) if (row.group.userData.bb) for (const q of row.group.userData.bb) q.quaternion.copy(camera.quaternion);
  // left behind: once the top of the pet slips off the bottom of the screen, the run is over
  if (state === 'play' && !pl.dead) {
    camera.updateMatrixWorld();
    if (tmp.copy(pl.root.position).setY(pl.root.position.y + 0.8).project(camera).y < -1) die('slow');
  }
  stage.followShadow(tmp.set(camX, 0, cz - 3));

  shadowBlob.position.set(pl.root.position.x, 0.02, pl.root.position.z);
  shadowBlob.visible = !sinking && rows.get(Math.round(-pl.root.position.z))?.type !== 'river';
  shadowBlob.scale.setScalar(1 - Math.max(0, pl.root.position.y) * 0.8);

  pl.mixer?.update(dt);
  bursts.update(dt);
  stage.render();
  requestAnimationFrame(tick);
}

// ---------- boot ----------
(async () => {
  const bar = $('loadBar');
  await preload(allPaths, p => { bar.style.width = `${Math.round(p * 100)}%`; });
  await stage.envReady;
  buildEagle();
  reset();
  state = 'title';
  setPet(petIndex);
  play('dance');
  $('title').hidden = false;
  $('loading').classList.add('done');
  $('coins').textContent = bank;
  lastT = performance.now();
  tick();
})();
</script>
</body>
</html>
